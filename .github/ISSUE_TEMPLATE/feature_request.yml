name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么场景下的什么问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你期望的行为或界面
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样的行为可以视为该功能完成（可勾选列表或场景描述）
    validations:
      required: true
