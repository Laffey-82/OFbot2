[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ofbot2"
version = "1.4.0"
description = "Extensible plugin-based bot framework with QQNT Red and OneBot adapters"
readme = "readme.md"
license = { file = "LICENSE" }
authors = [{ name = "OFbot 2 Contributors" }]
keywords = ["qq", "bot", "onebot", "napcat", "plugin", "chat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "APScheduler>=3.10.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "qrcode>=7.4.0",
    "jsonschema>=4.0.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Laffey-82/OFbot2"
Repository = "https://github.com/Laffey-82/OFbot2"
Documentation = "https://github.com/Laffey-82/OFbot2/tree/main/docs"
Changelog = "https://github.com/Laffey-82/OFbot2/blob/main/docs/CHANGELOG.md"

[project.scripts]
ofbot2 = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.16.0",
    "playwright>=1.49.0",
    "pytest-playwright>=0.9.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "plugins*", "ofbot2*"]
exclude = ["tests*", "examples*", "plugin-repo*", "docs*", "scripts*", "deploy*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*", "web/static/**/*"]
"plugins.system" = ["plugin.json"]
"plugins.template" = ["plugin.json"]
"plugins.example_ai" = ["plugin.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["_backup", ".pytest_cache", "__pycache__"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
    "S110",
    "SIM102",
    "DTZ005",
    "DTZ006",
]
